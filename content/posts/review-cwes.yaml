title: Review CWES
summary: >-
  In this article, I share my experience with the Hack The Box CWES
  certification, covering the course, labs, preparation, and exam. I also
  discuss which experience levels I think the certification is best suited for
  and share a few tips that helped me during my studies and while writing the
  final report.
