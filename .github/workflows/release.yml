name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    outputs:
      cutoff: ${{ steps.clock.outputs.cutoff }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Capture one UTC publication instant
        id: clock
        run: echo "cutoff=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"
      - name: Check production configuration
        id: config
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
        run: |
          if test -n "$AWS_REGION" && test -n "$AWS_DEPLOY_ROLE_ARN" && test -n "$S3_BUCKET" && test -n "$CLOUDFRONT_DISTRIBUTION_ID" && test -n "$CLOUDFRONT_DOMAIN"; then
            echo 'connected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'connected=false' >> "$GITHUB_OUTPUT"
            echo 'Production configuration is incomplete; deployment remains disabled.'
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.connected == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.config.outputs.connected == 'true'
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.connected == 'true'
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.config.outputs.connected == 'true'
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        if: steps.config.outputs.connected == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: portfolio-blog-preflight-${{ github.run_id }}
      - name: Compare eligible posts with active release
        id: decide
        if: steps.config.outputs.connected == 'true'
        env:
          BLOG_PUBLICATION_TIME: ${{ steps.clock.outputs.cutoff }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: node scripts/release-preflight.mjs

  verify:
    needs: preflight
    if: github.event_name != 'schedule' || needs.preflight.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      publication_cutoff: ${{ needs.preflight.outputs.cutoff }}
      release_artifact: ${{ needs.preflight.outputs.deploy == 'true' }}

  deploy:
    needs: [preflight, verify]
    if: github.ref == 'refs/heads/main' && needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: portfolio-blog-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: portfolio-blog-deploy-${{ github.run_id }}
      - name: Publish verified snapshot and recover on failure
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          CLOUDFRONT_DOMAIN: ${{ vars.CLOUDFRONT_DOMAIN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
