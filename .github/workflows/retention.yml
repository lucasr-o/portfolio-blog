name: Retain recoverable releases

on:
  schedule:
    - cron: '37 4 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show candidates without removing snapshots"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: prod
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: portfolio-blog-production
      cancel-in-progress: false
    steps:
      - name: Require production configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          test -n "$AWS_REGION"
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$S3_BUCKET"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: portfolio-blog-retention-${{ github.run_id }}
      - name: Apply recorded-object retention
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          PRUNE_CONFIRM: ${{ (github.event_name == 'schedule' || inputs.dry_run == false) && 'yes' || 'no' }}
        run: node scripts/prune-releases.mjs
